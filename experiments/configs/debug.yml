# ====================================
#         B E N T H I C   A I
# ====================================
#
# ===== Cluster =====
#
Cluster:
  "account"   : ["bsmfc"]
  "cpus"      : [1]                  
  "ram"       : ["1GB"]      
  "partition" : ["batch"]
  "time"      : ["00:00:30"]

# ===== Training Configuration =====
#
Training:

  config_wandb:
    "project": ["BenthicAI-Debug"]
    "mode":    ["online"]

  config_dataset:
    "r_validation":    [2]
    "k_validation":    [2]
    "k_test":          [10]
    "seed_validation": [1]
    "seed_test":       [1] 

  config_model:
    "model_type": ["gp"]

  config_gp:
    "kernel": ["RBF", "Matern52"]
    "alpha":  [1e-10]

  config_nn:
    "layers": [[64, 64]]
    "activation": ["relu"]