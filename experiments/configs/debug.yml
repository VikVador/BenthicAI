# ====================================
#         B E N T H I C   A I
# ====================================
#
Cluster:

  Train:
    "account"   : ["bsmfc"]
    "cpus"      : [1]                  
    "ram"       : ["1GB"]      
    "partition" : ["batch"]
    "time"      : ["00:02:30"]

  Evaluate:
    "account"   : ["bsmfc"]
    "cpus"      : [1]                  
    "ram"       : ["1GB"]      
    "partition" : ["batch"]
    "time"      : ["00:05:00"]

Training:

  config_wandb:
    "team":    ["benthicAI"]
    "project": ["Training-Debug"]
    "mode":    ["online"]

  config_dataset:
    "r_validation":    [2]
    "k_validation":    [4]
    "k_test":          [8]
    "seed_validation": [1]
    "seed_test":       [1] 

  config_model:
    "model_type": ["nn"]

  config_gp:
    "kernel": ["RBF"]
    "alpha":  [1e-10]

  config_nn:
    "epochs":        [1000]
    "learning_rate": [0.001]
    "layers":        [[8, 8]]
    "dropout":       [0.1]