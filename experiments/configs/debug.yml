# ====================================
#         B E N T H I C   A I
# ====================================
#
Cluster:

  Train:
    "account"   : ["bsmfc"]
    "cpus"      : [1]                  
    "ram"       : ["1GB"]      
    "partition" : ["batch"]
    "time"      : ["00:10:00"]

  Evaluate:
    "account"   : ["bsmfc"]
    "cpus"      : [1]                  
    "ram"       : ["1GB"]      
    "partition" : ["batch"]
    "time"      : ["00:05:00"]

Training:

  config_wandb:
    "team":    ["benthicAI"]
    "project": ["Training-Debug"]
    "mode":    ["online"]

  config_dataset:
    "r_validation":    [1]
    "k_validation":    [2]
    "k_test":          [4]
    "seed_validation": [1]
    "seed_test":       [1]
    "stats":           [["mean", "std", "min", "max"]]
    "period":          ["annual"] # Choose one of "annual", "seasonal", or "monthly"
    "q_min":           [2]
    "q_max":           [98]
    "zero_safe":       [true]

  config_model:
    "model_type": ["gp", "nn"] # Choose one of "gp" or "nn"

  config_gp:
    "n_restarts_optimizer": [4]
    "kernel":               ["ConstantKernel(1.0) * RBF(length_scale=1.0) + WhiteKernel()"]
    "alpha":                [0.0001]

  config_nn:
    "epochs":                [100]
    "learning_rate":         [0.00001]
    "layers":                [[4, 4]]
    "dropout":               [0.1]
    "num_components":        [2]   
    "num_inference_samples": [32]  