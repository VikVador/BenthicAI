Cluster:
  "account"   : ["bsmfc"]
  "cpus"      : [1]                  
  "ram"       : ["1GB"]      
  "partition" : ["batch"]
  "time"      : ["00:02:30"]

Training:

  config_wandb:
    "team":    ["benthicAI"]
    "project": ["Tranining-Debug"]
    "mode":    ["online"]

  config_dataset:
    "r_validation":    [2]
    "k_validation":    [4]
    "k_test":          [8]
    "seed_validation": [1]
    "seed_test":       [1] 

  config_model:
    "model_type": ["nn"]

  config_gp:
    "kernel": ["RBF"]
    "alpha":  [1e-10]

  config_nn:
    "layers": [[64, 64]]
    "activation": ["relu"]